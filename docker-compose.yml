services:
  recorder:
    build: ./recorder
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - ./recorder/record.sh:/record.sh:ro
      - ./data/archive:/archive
    entrypoint: ["/bin/sh", "/record.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build: ./scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - ./data/archive:/archive:ro
      - ./data/live:/live
      - ./data/static:/live-static
      - ./adhans:/adhans:ro
      - ./fillers:/fillers:ro
      - ./schedule:/schedule
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/live:/live:ro
      - ./data/archive:/archive:ro
      - ./data/static:/live-static:ro
      - ./web:/usr/share/nginx/html:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
