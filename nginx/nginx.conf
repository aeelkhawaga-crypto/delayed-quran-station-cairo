server {
    listen 80;
    server_name _;

    # Delayed live playlist: never cache, CORS open
    location = /live/delayed.m3u8 {
        alias /live/delayed.m3u8;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Archived segments: immutable once written
    location /archive/ {
        root /;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Static adhan / filler chunks: immutable once written
    location /live-static/ {
        root /;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Monitor page + read-only API: password-protected (htpasswd, family-hub style)
    # The monitor can change media, so it is HTTPS-only: requests that did
    # not come through the host's TLS proxy are sent to the HTTPS address.
    location = /monitor {
        return 301 https://quran.91-99-171-163.sslip.io/monitor/;
    }
    location /monitor/ {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://quran.91-99-171-163.sslip.io$request_uri;
        }
        client_max_body_size 64m;      # media uploads (app limit: 60 MB)
        proxy_request_buffering off;
        auth_basic "Quran monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-monitor;
        proxy_pass http://scheduler:8001/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;        # long audio exports
        proxy_buffering off;            # stream exports straight through
        add_header Cache-Control "no-store" always;
    }

    # Player page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }
}
