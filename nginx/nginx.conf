server {
    listen 80;
    server_name _;

    # Delayed live playlist: never cache, CORS open
    location = /live/delayed.m3u8 {
        alias /live/delayed.m3u8;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Archived segments: immutable once written
    location /archive/ {
        root /;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Static adhan / filler chunks: immutable once written
    location /live-static/ {
        root /;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Admin API (scheduler container)
    location /api/ {
        proxy_pass http://scheduler:8000;
        proxy_set_header Host $host;
        client_max_body_size 150m;
    }

    # Admin console
    location = /admin {
        return 302 $scheme://$http_host/admin.html;
    }

    # Player page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }
}
