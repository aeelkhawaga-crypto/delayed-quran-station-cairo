<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran Radio — Live for Ireland</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1b2a; color: #e0e1dd; font-family: system-ui, -apple-system, sans-serif;
  }
  main { text-align: center; padding: 2rem; max-width: 34rem; }
  h1 { font-weight: 600; font-size: 1.6rem; margin-bottom: .25rem; }
  .sub { color: #778da9; margin-bottom: 2rem; }
  button {
    font-size: 1.1rem; padding: .9rem 2.4rem; border: none; border-radius: 999px;
    background: #1b6ca8; color: #fff; cursor: pointer;
  }
  button:disabled { background: #415a77; cursor: default; }
  #status { margin-top: 1.2rem; min-height: 1.4em; color: #a8c0d8; }
  #clock { font-variant-numeric: tabular-nums; font-size: 2.2rem; margin-top: 1.6rem; }
  #clockLabel { color: #778da9; font-size: .85rem; }
  .direct { margin-top: 2rem; font-size: .8rem; color: #778da9; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Quran Radio &mdash; Live</h1>
  <p class="sub">Broadcast from Cairo, time-shifted 2 hours to match Irish local time.</p>
  <button id="play" disabled>Loading&hellip;</button>
  <div id="status"></div>
  <div id="clock"></div>
  <div id="clockLabel">Time in Ireland</div>
  <p class="direct">Listen in an external player (VLC, etc.):<br><span id="url"></span></p>
</main>
<script>
  const playlist = location.origin + '/live/delayed.m3u8';
  document.getElementById('url').textContent = playlist;

  const btn = document.getElementById('play');
  const status = document.getElementById('status');
  let audio = new Audio();

  function setStatus(msg) { status.textContent = msg; }

  if (Hls.isSupported()) {
    const hls = new Hls({ liveSyncDurationCount: 3 });
    hls.loadSource(playlist);
    hls.attachMedia(audio);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { btn.disabled = false; btn.textContent = '▶ Play'; });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        setStatus('Connection issue — retrying…');
        hls.startLoad();
      }
    });
    window._hls = hls;
  } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
    audio.src = playlist;
    btn.disabled = false;
    btn.textContent = '▶ Play';
  } else {
    setStatus('Your browser does not support HLS playback.');
  }

  btn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      btn.textContent = '❚❚ Pause';
      setStatus('Listening — this stream is 2 hours behind Cairo.');
    } else {
      audio.pause();
      btn.textContent = '▶ Play';
      setStatus('');
    }
  });

  const fmt = new Intl.DateTimeFormat('en-IE', {
    timeZone: 'Europe/Dublin', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  function tick() { document.getElementById('clock').textContent = fmt.format(new Date()); }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
